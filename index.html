<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>太陽光設備 見積依頼書メーカー</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --border-color: #333;
      --bg-color: #f5f6fa;
      --paper-bg: #fff;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background-color: var(--bg-color);
      color: #333;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    
    /* Layout */
    .container {
      display: flex;
      width: 100%;
      height: 100%;
    }
    .form-area {
      width: 400px;
      min-width: 300px;
      padding: 20px;
      background-color: #fff;
      border-right: 1px solid #ccc;
      overflow-y: auto;
      box-shadow: 2px 0 5px rgba(0,0,0,0.05);
      z-index: 10;
    }
    .preview-area {
      flex: 1;
      padding: 20px;
      overflow: auto;
      background-color: #e0e4e8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    @media (max-width: 1024px) {
      body { height: auto; overflow: auto; }
      .container { flex-direction: column; }
      .form-area { width: 100%; border-right: none; border-bottom: 1px solid #ccc; }
      .preview-area { padding: 10px; }
    }

    /* Form Styles */
    h2 { font-size: 1.2rem; margin-top: 0; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
    .form-group input[type="text"],
    .form-group input[type="date"],
    .form-group textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-family: inherit;
    }
    .form-group textarea { resize: vertical; min-height: 60px; }
    .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 0.85rem; }
    .checkbox-grid label { display: flex; align-items: center; font-weight: normal; margin-bottom: 0; }
    .checkbox-grid input { margin-right: 5px; }
    
    /* Buttons */
    .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; margin-bottom: 20px; }
    button {
      padding: 10px;
      font-size: 1rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    #btn-preview { background-color: #3498db; color: white; }
    #btn-preview:hover { background-color: #2980b9; }
    #btn-pdf { background-color: #2ecc71; color: white; }
    #btn-pdf:hover { background-color: #27ae60; }
    #btn-reset { background-color: #e74c3c; color: white; }
    #btn-reset:hover { background-color: #c0392b; }

    /* Warning */
    .warning {
      background-color: #fff3cd;
      color: #856404;
      border: 1px solid #ffeeba;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
      font-size: 0.85rem;
      display: none;
    }

    /* Paper/Report Styles */
    .report-paper {
      width: 210mm;
      height: 295.5mm;
      padding: 10mm 15mm 10mm 15mm;
      background-color: var(--paper-bg);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      box-sizing: border-box;
      color: #000;
      font-family: "MS Pゴシック", "Hiragino Kaku Gothic ProN", Arial, sans-serif;
      font-size: 10pt;
      line-height: 1.45;
      position: relative;
    }

    .report-title-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 12px;
    }
    .report-title {
      font-size: 18pt;
      font-weight: bold;
      text-align: center;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }
    .report-type-checkboxes {
      font-size: 10.5pt;
      display: flex;
      gap: 30px;
    }

    .report-dest-container {
      font-size: 12pt;
      width: 250px;
      border-bottom: 1px solid #000;
      padding-bottom: 2px;
      margin-bottom: 15px;
      display: flex;
      align-items: flex-end;
    }
    .report-dest-value {
      flex: 1;
      text-align: center;
      font-weight: bold;
      min-height: 1.2em;
    }
    .report-dest-suffix {
      margin-left: 5px;
    }

    .report-meta-section {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .meta-left {
      width: 62%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 12px;
    }
    .meta-row {
      display: flex;
      align-items: flex-end;
      border-bottom: 1px solid #000;
      padding-bottom: 2px;
    }
    .meta-label {
      font-weight: bold;
      font-size: 10pt;
      width: 110px;
      display: inline-block;
      border-bottom: 1px solid #000;
      margin-bottom: -3px;
      padding-bottom: 3px;
    }
    .meta-value {
      flex: 1;
      padding-left: 10px;
      font-size: 10pt;
    }
    .meta-value.flex-row {
      display: flex;
      justify-content: flex-start;
      gap: 30px;
      padding-left: 10px;
    }

    .meta-right {
      width: 35%;
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }
    .report-date-container {
      font-size: 9.5pt;
      margin-bottom: 5px;
      letter-spacing: 1px;
    }
    .company-name {
      font-size: 11pt;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .stamp-table {
      border-collapse: collapse;
      width: 180px;
    }
    .stamp-table td {
      border: 1px solid #000;
      text-align: center;
      font-size: 8pt;
      padding: 2px;
      width: 60px;
    }
    .stamp-box {
      height: 40px;
    }

    .meta-full-width {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 15px;
    }

    /* Section Headings */
    .section-heading {
      font-size: 10.5pt;
      font-weight: bold;
      border-bottom: 1px solid #000;
      margin-top: 12px;
      margin-bottom: 6px;
      padding-bottom: 2px;
    }
    .section-heading.inline {
      display: inline-block;
    }
    .section-heading.full {
      display: block;
      width: 100%;
    }

    /* Checkbox grid */
    .grid-3col {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px 10px;
      font-size: 9.5pt;
    }
    .grid-item {
      display: flex;
      align-items: center;
    }
    .sub-section-header {
      text-align: center;
      font-size: 9pt;
      font-weight: bold;
      margin-top: 8px;
      margin-bottom: 4px;
      color: #333;
    }

    /* Content wraps */
    .pre-wrap {
      white-space: pre-wrap;
      word-break: break-all;
    }
    .report-text-content {
      font-size: 9.5pt;
      line-height: 1.5;
      padding-left: 10px;
      margin-bottom: 10px;
    }

    /* 印刷用スタイル（高精細テキストPDF出力用） */
    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }
      body {
        background-color: #fff !important;
        color: #000 !important;
        margin: 0 !important;
        padding: 0 !important;
        height: auto !important;
        overflow: visible !important;
        -webkit-print-color-adjust: exact !important; /* 背景色やチェックマークの印刷品質維持 */
        print-color-adjust: exact !important;
      }
      .container {
        display: block !important;
        width: 100% !important;
        height: auto !important;
      }
      .form-area {
        display: none !important;
      }
      .preview-area {
        padding: 0 !important;
        background-color: #fff !important;
        overflow: visible !important;
        display: block !important;
        width: 100% !important;
        height: auto !important;
      }
      .report-paper {
        width: 210mm !important;
        height: 295.5mm !important;
        padding: 10mm 15mm 10mm 15mm !important;
        box-shadow: none !important;
        margin: 0 !important;
        border: none !important;
        box-sizing: border-box !important;
        page-break-inside: avoid !important;
        page-break-after: avoid !important;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 入力フォームエリア -->
  <div class="form-area">
    <h2>入力フォーム</h2>
    <div id="validation-warning" class="warning">必須項目（見積依頼番号、住所、工事件名）が未入力です。</div>
    
    <form id="input-form">
      <div class="form-group">
        <label>種別</label>
        <label><input type="radio" name="type" value="新規" checked> 新規</label>
        <label><input type="radio" name="type" value="追加変更"> 追加変更</label>
      </div>
      <div class="form-group">
        <label>宛先</label>
        <input type="text" id="in-dest" placeholder="〇〇株式会社">
      </div>
      <div class="form-group">
        <label>1. 見積依頼番号 <span style="color:red">*</span></label>
        <input type="text" id="in-no" placeholder="例: REQ-2023-001">
      </div>
      <div class="form-group">
        <label>2. 住所 <span style="color:red">*</span></label>
        <input type="text" id="in-address" placeholder="東京都...">
      </div>
      <div class="form-group">
        <label>3. 工事件名 <span style="color:red">*</span></label>
        <input type="text" id="in-project" placeholder="〇〇太陽光発電所建設工事">
      </div>
      <div class="form-group">
        <label>4. 工期</label>
        <div style="display:flex; gap:10px; align-items:center;">
          着工 <input type="date" id="in-date-start">
          <br>
          引渡 <input type="date" id="in-date-end">
        </div>
      </div>
      <div class="form-group">
        <label>5. 見積期間</label>
        <input type="text" id="in-period" placeholder="〇週間以内">
      </div>
      <div class="form-group">
        <label>6. 工事</label>
        <div class="checkbox-grid" id="in-works">
          <!-- JSで生成 -->
        </div>
      </div>
      <div class="form-group">
        <label>7. 試験その他</label>
        <div class="checkbox-grid" id="in-tests">
          <!-- JSで生成 -->
        </div>
      </div>
      <div class="form-group">
        <label>8. 工事内容</label>
        <textarea id="in-details">本依頼書は、太陽光発電設備（発電所または自家消費）の建設工事の見積依頼です。
別紙の項目表および添付資料（配置図等）により見積をお願いいたします。</textarea>
      </div>
      <div class="form-group">
        <label>9. その他</label>
        <textarea id="in-others">・客先特別仕様がある場合は、資料を添付しますので、見積に反映すること。
・海岸より近傍の場合は、必要に応じて主要機器を耐塩塗装とすること。
（海岸より300m→重耐塩、海岸より301～1000m→耐塩）</textarea>
      </div>

      <div class="btn-group">
        <button type="button" id="btn-preview">プレビュー更新</button>
        <button type="button" id="btn-pdf">PDF出力</button>
        <button type="button" id="btn-reset">入力リセット</button>
      </div>
    </form>
  </div>

  <!-- プレビューエリア -->
  <div class="preview-area">
    <div id="report-paper" class="report-paper">
      
      <!-- タイトルと種別 -->
      <div class="report-title-container">
        <div class="report-title">太陽光設備　見積依頼書</div>
        <div class="report-type-checkboxes" id="out-type">
          <span>□ 新規</span>
          <span>□ 追加変更</span>
        </div>
      </div>
      
      <!-- 宛先 -->
      <div class="report-dest-container">
        <span class="report-dest-value" id="out-dest"></span>
        <span class="report-dest-suffix">様</span>
      </div>

      <!-- 基本情報エリア（2カラム） -->
      <div class="report-meta-section">
        <div class="meta-left">
          <div class="meta-row">
            <span class="meta-label">1 見積依頼番号</span>
            <span class="meta-value" id="out-no"></span>
          </div>
          <div class="meta-row">
            <span class="meta-label">2 住　　　　所</span>
            <span class="meta-value" id="out-address"></span>
          </div>
          <div class="meta-row">
            <span class="meta-label">3 工 事 件 名</span>
            <span class="meta-value" id="out-project"></span>
          </div>
        </div>
        <div class="meta-right">
          <div class="report-date-container" id="out-print-date">年　　月　　日</div>
          <div class="company-name">エイコーエナジオ株式会社</div>
          <table class="stamp-table">
            <tr>
              <td></td>
              <td></td>
              <td>担当</td>
            </tr>
            <tr>
              <td class="stamp-box"></td>
              <td class="stamp-box"></td>
              <td class="stamp-box"></td>
            </tr>
          </table>
        </div>
      </div>

      <!-- 期間情報（全幅） -->
      <div class="meta-full-width">
        <div class="meta-row">
          <span class="meta-label">4 工　　　　期</span>
          <span class="meta-value flex-row" id="out-term">
            <span>着工　<span id="out-date-start-val">　　年　月　日</span></span>
            <span>引渡　<span id="out-date-end-val">　　年　月　日</span></span>
          </span>
        </div>
        <div class="meta-row">
          <span class="meta-label">5 見 積 期 間</span>
          <span class="meta-value" id="out-period"></span>
        </div>
      </div>

      <!-- 6 工事 -->
      <div class="section-heading inline">6 工　　　事</div>
      <div class="grid-3col" id="out-works-standard"></div>
      <div class="sub-section-header">——自家消費など既設設備がある場合——</div>
      <div class="grid-3col" id="out-works-existing"></div>

      <!-- 7 試験その他 -->
      <div class="section-heading inline">7 試験その他</div>
      <div class="grid-3col" id="out-tests"></div>

      <!-- 8 工事内容 -->
      <div class="section-heading full">8 工 事 内 容</div>
      <div class="pre-wrap report-text-content" id="out-details"></div>

      <!-- 9 その他 -->
      <div class="section-heading full">9 そ の 他</div>
      <div class="pre-wrap report-text-content" id="out-others"></div>

    </div>
  </div>
</div>

<script>
  // 定数定義
  const WORK_ITEMS = [
    "引込工事", "受変電設備工事", "架台設置工事", "通信設備工事",
    "電気配線工事", "接地工事", "モジュール設置工事", "フェンス工事",
    "造成工事", "既設改修・改造工事", "既設移設・撤去工事", "その他必要な工事"
  ];
  const TEST_ITEMS = [
    "使用前自主検査", "IVカーブ測定", "主任技術者費用（工期中）", "土地境界確定",
    "除草・ツタ取り", "完成図書", "産業廃棄物処理", "各届け出", "住民説明会（必要に応じて）"
  ];
  
  const defaultDetails = `本依頼書は、太陽光発電設備（発電所または自家消費）の建設工事の見積依頼です。\n別紙の項目表および添付資料（配置図等）により見積をお願いいたします。`;
  const defaultOthers = `・客先特別仕様がある場合は、資料を添付しますので、見積に反映すること。\n・海岸より近傍の場合は、必要に応じて主要機器を耐塩塗装とすること。\n（海岸より300m→重耐塩、海岸より301～1000m→耐塩）`;

  // 初期化
  function init() {
    renderCheckboxes("in-works", "work", WORK_ITEMS);
    renderCheckboxes("in-tests", "test", TEST_ITEMS);
    
    // 日付設定
    const today = new Date();
    const yyyy = today.getFullYear();
    const m = today.getMonth() + 1;
    const d = today.getDate();
    document.getElementById("out-print-date").innerText = `${yyyy}年 ${m}月 ${d}日`;
    
    updatePreview();
  }

  function renderCheckboxes(containerId, namePrefix, items) {
    const container = document.getElementById(containerId);
    container.innerHTML = "";
    items.forEach((item, index) => {
      const label = document.createElement("label");
      label.innerHTML = `<input type="checkbox" name="${namePrefix}" value="${item}"> ${item}`;
      container.appendChild(label);
    });
  }

  // 日付フォーマット
  function formatDate(dateStr) {
    if (!dateStr) return "　　　　年　月　日";
    const date = new Date(dateStr);
    if (isNaN(date.getTime())) return "　　　　年　月　日";
    return `${date.getFullYear()}年 ${date.getMonth() + 1}月 ${date.getDate()}日`;
  }

  // プレビュー更新
  function updatePreview() {
    // 種別
    const typeRadios = document.getElementsByName("type");
    let isNew = true;
    for (const radio of typeRadios) {
      if (radio.checked && radio.value === "追加変更") isNew = false;
    }
    
    const typeContainer = document.getElementById("out-type");
    typeContainer.innerHTML = "";
    const spanNew = document.createElement("span");
    spanNew.innerText = (isNew ? "☑" : "□") + " 新規";
    const spanChange = document.createElement("span");
    spanChange.innerText = (!isNew ? "☑" : "□") + " 追加変更";
    typeContainer.appendChild(spanNew);
    typeContainer.appendChild(spanChange);

    // 宛先
    const dest = document.getElementById("in-dest").value;
    document.getElementById("out-dest").innerText = dest || "";

    // 1~3, 5, 8, 9
    const no = document.getElementById("in-no").value;
    const address = document.getElementById("in-address").value;
    const project = document.getElementById("in-project").value;
    
    document.getElementById("out-no").innerText = no;
    document.getElementById("out-address").innerText = address;
    document.getElementById("out-project").innerText = project;
    document.getElementById("out-period").innerText = document.getElementById("in-period").value;
    document.getElementById("out-details").innerText = document.getElementById("in-details").value;
    document.getElementById("out-others").innerText = document.getElementById("in-others").value;

    // 4 工期
    const dateStart = document.getElementById("in-date-start").value;
    const dateEnd = document.getElementById("in-date-end").value;
    document.getElementById("out-date-start-val").innerText = dateStart ? formatDate(dateStart) : "　　　　年　月　日";
    document.getElementById("out-date-end-val").innerText = dateEnd ? formatDate(dateEnd) : "　　　　年　月　日";

    // バリデーション警告
    const warning = document.getElementById("validation-warning");
    if (!no || !address || !project) {
      warning.style.display = "block";
    } else {
      warning.style.display = "none";
    }

    // 6 工事
    const worksStandard = document.getElementById("out-works-standard");
    const worksExisting = document.getElementById("out-works-existing");
    worksStandard.innerHTML = "";
    worksExisting.innerHTML = "";
    const workCheckboxes = document.getElementsByName("work");
    workCheckboxes.forEach((cb, index) => {
      const div = document.createElement("div");
      div.className = "grid-item";
      div.innerText = (cb.checked ? "☑ " : "□ ") + cb.value;
      if (index < 9) {
        worksStandard.appendChild(div);
      } else {
        worksExisting.appendChild(div);
      }
    });

    // 7 試験その他
    const testsContainer = document.getElementById("out-tests");
    testsContainer.innerHTML = "";
    const testCheckboxes = document.getElementsByName("test");
    testCheckboxes.forEach(cb => {
      const div = document.createElement("div");
      div.className = "grid-item";
      div.innerText = (cb.checked ? "☑ " : "□ ") + cb.value;
      testsContainer.appendChild(div);
    });
  }

  // イベントリスナー
  document.getElementById("btn-preview").addEventListener("click", updatePreview);

  document.getElementById("btn-reset").addEventListener("click", () => {
    document.getElementById("input-form").reset();
    document.getElementById("in-details").value = defaultDetails;
    document.getElementById("in-others").value = defaultOthers;
    updatePreview();
  });

  document.getElementById("btn-pdf").addEventListener("click", () => {
    updatePreview(); // 最新状態にする
    
    // YYYYMMDDの取得
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    
    // 工事件名を取得してファイル名に使用（使用できない文字を置換）
    const project = document.getElementById("in-project").value.trim().replace(/[\\/:*?"<>|]/g, "_");
    const namePart = project ? `-${project}` : "";
    const filename = `${yyyy}${mm}${dd}${namePart}`;

    // 元のタイトルを一時保存し、印刷用ファイル名（デフォルト名）に変更
    const originalTitle = document.title;
    document.title = filename;

    // ブラウザ標準の印刷機能（テキスト選択可能な高精細PDF）を呼び出し
    window.print();

    // 印刷終了後に元のタイトルに戻す
    document.title = originalTitle;
  });

  // 初期化実行
  document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
